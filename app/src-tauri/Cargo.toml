[package]
name = "tauri-appdelumie"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_appdelumie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = false # Disable incremental build to save disk space (trades compilation time for space)
debug = 0 # Disable debug info to massively reduce disk usage (save ~2-5GB)
strip = "debuginfo" # Strip symbols

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["full", "time"] }
futures-util = "0.3"
time = "=0.3.36"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
pdf-extract = "0.7"
bytemuck = "1.14"
